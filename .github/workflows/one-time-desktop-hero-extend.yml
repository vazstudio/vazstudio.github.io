name: One-time desktop hero extend

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extend desktop hero image only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '@media(min-width:851px)'
          if marker not in s:
              raise SystemExit('Desktop media section not found; no change made.')
          addition = '@media(min-width:851px){.hero{overflow:visible}.hero-bg-force{height:calc(100% + 110px);background-size:100% auto;background-position:center top}.features{position:relative;z-index:5}}'
          if addition not in s:
              s = s.replace(marker, addition + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Extend desktop hero image behind features'
          git push
      - name: Remove workflow
        if: always()
        run: |
          rm -f .github/workflows/one-time-desktop-hero-extend.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/one-time-desktop-hero-extend.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Remove one-time desktop hero workflow'
          git push
