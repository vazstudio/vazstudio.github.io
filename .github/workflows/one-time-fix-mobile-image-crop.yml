name: One-time fix mobile image crop

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix mobile hero image crop
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'background-size:cover;background-position:center top;background-repeat:no-repeat;opacity:1}'
          new = 'background-size:100% auto;background-position:center top;background-repeat:no-repeat;opacity:1}'
          if old not in s:
              raise SystemExit('Expected mobile hero background rule not found; no change made.')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Show full mobile hero image'
            git push
          fi

      - name: Remove one-time workflow
        if: always()
        run: |
          rm -f .github/workflows/one-time-fix-mobile-image-crop.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/one-time-fix-mobile-image-crop.yml
          if git diff --cached --quiet; then
            echo 'Workflow already removed.'
          else
            git commit -m 'Remove one-time mobile image workflow'
            git push
          fi
