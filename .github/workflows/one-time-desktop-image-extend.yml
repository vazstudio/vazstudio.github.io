name: One-time desktop image extend

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extend desktop hero image only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='</style>'
          css='\n@media(min-width:851px){.hero{overflow:visible!important}.hero-bg-force{height:calc(100% + 280px)!important;background-size:100% auto!important;background-position:center top!important;background-repeat:no-repeat!important}.features{position:relative;z-index:5}}\n'
          if css.strip() not in s:
              s=s.replace(marker,css+marker,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Extend desktop hero image below features" || exit 0
          git push
      - name: Remove this one-time workflow
        if: always()
        run: |
          rm -f .github/workflows/one-time-desktop-image-extend.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/one-time-desktop-image-extend.yml
          git commit -m "Remove one-time desktop image workflow" || exit 0
          git push
