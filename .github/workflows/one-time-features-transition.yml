name: One-time seamless features transition
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine mobile features transition
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = '''\n@media(max-width:850px){\n  .features{border:0!important;border-radius:0!important;overflow:visible!important;background:linear-gradient(180deg,rgba(8,3,12,0) 0%,rgba(8,3,12,.16) 18%,rgba(8,3,12,.30) 100%)!important;box-shadow:none!important;width:100%!important;margin:0!important;}\n  .feature-grid{width:calc(100% - 48px)!important;margin:0 auto!important;background:transparent!important;}\n  .feature{background:transparent!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;border-left:1px solid rgba(229,183,200,.12)!important;}\n  .feature:first-child{border-left:1px solid rgba(229,183,200,.12)!important;}\n  .feature:last-child{border-left:0!important;}\n}\n'''
          if 'seamless-features-transition' not in s:
              s = s.replace('</style>', '<!-- seamless-features-transition -->'+css+'</style>', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make mobile features transition seamless"
          git push
