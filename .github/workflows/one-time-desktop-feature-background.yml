name: One-time desktop feature background

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extend desktop hero background
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '</style>'
          css = '''
          @media(min-width:851px){
            .hero{overflow:visible!important}
            .hero-bg-force{height:calc(100% + 112px)!important;bottom:auto!important;background-size:cover!important;background-position:center top!important;background-repeat:no-repeat!important}
            .features{position:relative;z-index:5;background:transparent!important}
          }
          '''
          if '@media(min-width:851px){' in s and '.hero-bg-force{height:calc(100% + 112px)' in s:
              print('Desktop extension already present.')
          else:
              if marker not in s:
                  raise SystemExit('style marker not found; no change made.')
              s = s.replace(marker, css + '\n' + marker, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Extend desktop hero background behind features'
          git push

      - name: Remove one-time workflow
        if: always()
        run: |
          rm -f .github/workflows/one-time-desktop-feature-background.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/one-time-desktop-feature-background.yml
          git diff --cached --quiet || git commit -m 'Remove one-time desktop background workflow'
          git push
