name: One-time mobile features fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'index.html';
            const { data } = await github.rest.repos.getContent({owner, repo, path, ref: 'main'});
            const content = Buffer.from(data.content, 'base64').toString('utf8');
            const marker = '@media(max-width:520px){';
            const override = '@media(max-width:850px){.features{overflow:visible}.feature-grid{min-height:216px}.feature{min-height:108px}}\n';
            if (content.includes(override.trim())) throw new Error('Fix already present');
            const updated = content.replace(marker, override + marker);
            if (updated === content) throw new Error('Mobile CSS marker not found');
            const result = await github.rest.repos.createOrUpdateFileContents({owner, repo, path, branch:'main', message:'Fix mobile features spacing', content:Buffer.from(updated).toString('base64'), sha:data.sha});
            core.info(`Updated index.html at ${result.data.commit.sha}`);
            const wf = await github.rest.repos.getContent({owner, repo, path:'.github/workflows/one-time-mobile-features-fix.yml', ref:'main'});
            await github.rest.repos.deleteFile({owner, repo, path:'.github/workflows/one-time-mobile-features-fix.yml', branch:'main', message:'Remove one-time mobile features fix', sha:wf.data.sha});
