name: One-time show full hero image
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show full hero image without side cropping
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '.hero-bg-force{position:absolute;inset:0;z-index:0;background:url("./vaz-store-bg.jpg?v=20260916-10") center top/cover no-repeat;background-repeat:no-repeat;pointer-events:none}'
          new = '.hero-bg-force{position:absolute;inset:0;z-index:0;background:url("./vaz-store-bg.jpg?v=20260916-10") center top/contain no-repeat;background-repeat:no-repeat;pointer-events:none}'
          if old not in s:
              raise SystemExit('Expected hero background rule not found; no change made.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Show full hero image without side cropping'
          git push
      - name: Remove one-time workflow
        if: success()
        run: |
          rm -f .github/workflows/one-time-show-full-hero-image.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/one-time-show-full-hero-image.yml
          git diff --cached --quiet || git commit -m 'Remove one-time full hero image workflow'
          git push
