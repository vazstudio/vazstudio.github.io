name: One-time desktop image final
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply desktop-only hero extension
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='''\n@media(min-width:851px){\n  .hero{overflow:visible!important}\n  .hero-bg-force{\n    height:calc(100% + 150px)!important;\n    bottom:auto!important;\n    background-size:100% 100%!important;\n    background-position:center top!important;\n    background-repeat:no-repeat!important;\n  }\n  .features{position:relative;z-index:5}\n}\n'''
          if '@media(min-width:851px){\n  .hero{overflow:visible!important}' not in s:
              s=s.replace('</style>',css+'</style>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          if git diff --cached --quiet; then echo 'No change'; else git commit -m 'Extend desktop hero image behind features'; git push; fi
      - name: Remove this workflow
        if: always()
        run: |
          rm -f .github/workflows/one-time-desktop-image-final.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/one-time-desktop-image-final.yml
          if git diff --cached --quiet; then echo 'Already removed'; else git commit -m 'Remove one-time desktop image workflow'; git push; fi
