name: Desktop hero image fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply desktop-only CSS fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='</style>'
          css='\n@media(min-width:851px){body{background-image:none!important}.hero-bg-force{background-size:cover!important;background-position:center top!important;background-repeat:no-repeat!important}}\n'
          if css.strip() not in s:
              s=s.replace(marker,css+marker,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Fix desktop hero image layering" || exit 0
          git push
